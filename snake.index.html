<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 - 需支付版</title>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 { margin-top: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        .game-container {
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        canvas {
            background-color: #000;
            display: block;
            border: 4px solid #34495e;
        }

        .score-board {
            margin-bottom: 10px;
            font-size: 1.5rem;
            display: flex;
            gap: 20px;
        }

        /* 界面覆盖层 */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
        }

        .hidden { display: none !important; }

        /* 按钮样式 */
        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            outline: none;
            margin: 10px;
        }

        .btn-green { background-color: #27ae60; color: white; }
        .btn-green:hover { background-color: #2ecc71; }

        .btn-blue { background-color: #3498db; color: white; }
        .btn-blue:hover { background-color: #2980b9; }

        .controls-hint { margin-top: 15px; font-size: 0.9rem; color: #bdc3c7; }

        /* 收款码图片样式 */
        .qr-code {
            width: 200px;
            height: 200px;
            background-color: white; /* 防止图片未加载时全黑 */
            margin-bottom: 20px;
            border: 5px solid white;
            border-radius: 10px;
        }
        
        .price-tag {
            font-size: 2rem;
            color: #f1c40f;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>贪吃蛇大作战</h1>

    <div class="score-board">
        <span>分数: <span id="score">0</span></span>
        <span>最高分: <span id="highScore">0</span></span>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <!-- 1. 初始支付界面 -->
        <div id="payScreen" class="overlay">
            <h2 style="color: #f1c40f;">游戏收费</h2>
            <p>本游戏需支付才可游玩</p>
            <div class="price-tag">¥ 0.10 / 局</div>
            <button class="btn-blue" onclick="showQRCode()">立即支付</button>
        </div>

        <!-- 2. 二维码展示界面 -->
        <div id="qrScreen" class="overlay hidden">
            <h3>请扫码支付 0.1 元</h3>
            <!-- 这里引用了你的收款码图片 -->
            <img src="pay.jpg" alt="收款码" class="qr-code">
            <p style="font-size: 0.9rem; color: #ccc; margin-bottom: 20px;">支付完成后请点击下方按钮</p>
            
            <div>
                <button class="btn-green" onclick="confirmPayment()">我已支付</button>
                <button style="background-color: #7f8c8d; color: white;" onclick="closeQRCode()">取消</button>
            </div>
        </div>

        <!-- 3. 游戏开始界面 (支付后显示) -->
        <div id="startScreen" class="overlay hidden">
            <h2 style="color: #2ecc71;">支付成功!</h2>
            <button class="btn-green" onclick="startGame()">开始游戏</button>
            <p class="controls-hint">使用方向键或 WASD 控制移动</p>
        </div>

        <!-- 4. 游戏结束界面 -->
        <div id="gameOverScreen" class="overlay hidden">
            <h2>游戏结束!</h2>
            <p style="font-size: 1.5rem; margin-bottom: 20px;">最终得分: <span id="finalScore">0</span></p>
            <!-- 游戏结束后，点击按钮会回到支付界面 -->
            <button class="btn-blue" onclick="resetToPay()">再玩一局 (需支付)</button>
        </div>
    </div>

    <script>
        /** JavaScript 逻辑部分 **/
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const finalScoreEl = document.getElementById('finalScore');
        
        // 获取各个界面层
        const payScreen = document.getElementById('payScreen');
        const qrScreen = document.getElementById('qrScreen');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');

        // 游戏配置
        const TILE_SIZE = 20;
        const TILE_COUNT = canvas.width / TILE_SIZE;
        const GAME_SPEED = 100;

        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let snake = [];
        let apple = { x: 5, y: 5 };
        let dx = 0; let dy = 0;
        let gameInterval;
        let isGameRunning = false;
        let nextDirection = { x: 0, y: 0 };

        highScoreEl.innerText = highScore;

        // --- 支付逻辑 ---

        // 显示二维码层
        function showQRCode() {
            payScreen.classList.add('hidden');
            qrScreen.classList.remove('hidden');
        }

        // 关闭二维码层（返回上一级）
        function closeQRCode() {
            qrScreen.classList.add('hidden');
            payScreen.classList.remove('hidden');
        }

        // 确认支付（进入游戏准备层）
        function confirmPayment() {
            // 这里仅仅是模拟，无法真实验证是否到账
            qrScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }

        // 游戏结束后重置回支付界面
        function resetToPay() {
            gameOverScreen.classList.add('hidden');
            payScreen.classList.remove('hidden');
            // 清除画布
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // --- 游戏核心逻辑 ---

        function startGame() {
            snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }, { x: 10, y: 12 }];
            score = 0;
            dx = 0; dy = -1;
            nextDirection = { x: 0, y: -1 };
            scoreEl.innerText = score;
            
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            isGameRunning = true;
            generateApple();

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, GAME_SPEED);
        }

        function gameLoop() {
            if (!isGameRunning) return;
            update();
            draw();
        }

        function update() {
            if (nextDirection.x !== 0 || nextDirection.y !== 0) {
                dx = nextDirection.x; dy = nextDirection.y;
            }

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver(); return;
            }

            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver(); return;
                }
            }

            snake.unshift(head);

            if (head.x === apple.x && head.y === apple.y) {
                score++;
                scoreEl.innerText = score;
                generateApple();
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#e74c3c';
            ctx.shadowBlur = 10; ctx.shadowColor = "red";
            ctx.beginPath();
            ctx.arc(apple.x * TILE_SIZE + 10, apple.y * TILE_SIZE + 10, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            snake.forEach((part, index) => {
                ctx.fillStyle = (index === 0) ? '#27ae60' : '#2ecc71';
                ctx.fillRect(part.x * TILE_SIZE + 1, part.y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);
            });
        }

        function generateApple() {
            while (true) {
                let newApple = {
                    x: Math.floor(Math.random() * TILE_COUNT),
                    y: Math.floor(Math.random() * TILE_COUNT)
                };
                let collision = false;
                for (let part of snake) {
                    if (part.x === newApple.x && part.y === newApple.y) collision = true;
                }
                if (!collision) { apple = newApple; break; }
            }
        }

        function gameOver() {
            isGameRunning = false;
            clearInterval(gameInterval);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.innerText = highScore;
            }
            finalScoreEl.innerText = score;
            gameOverScreen.classList.remove('hidden');
        }

        document.addEventListener('keydown', changeDirection);
        function changeDirection(event) {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(event.code) > -1) {
                event.preventDefault();
            }
            const LEFT = 37, RIGHT = 39, UP = 38, DOWN = 40;
            const A = 65, D = 68, W = 87, S = 83;
            const key = event.keyCode;
            const goUp = dy === -1, goDown = dy === 1, goRight = dx === 1, goLeft = dx === -1;

            if ((key === LEFT || key === A) && !goRight) nextDirection = { x: -1, y: 0 };
            if ((key === UP || key === W) && !goDown) nextDirection = { x: 0, y: -1 };
            if ((key === RIGHT || key === D) && !goLeft) nextDirection = { x: 1, y: 0 };
            if ((key === DOWN || key === S) && !goUp) nextDirection = { x: 0, y: 1 };
        }
    </script>
</body>
</html>
